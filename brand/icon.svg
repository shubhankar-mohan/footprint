<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Footprint">
  <title>Footprint</title>
  <defs>
    <!-- Warm sand. The warmth in this identity comes from the ground the print
         sits in, not from repainting Harbor's blues — the mark stays harbour ink. -->
    <linearGradient id="sand" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0"    stop-color="#F6EEE1"/>
      <stop offset="0.52" stop-color="#E7DAC6"/>
      <stop offset="1"    stop-color="#D2BFA5"/>
    </linearGradient>
    <radialGradient id="light" cx="0.32" cy="0.04" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- The print reads as pressed into the sand: a warm rim of displaced light
         below it rather than a grey drop shadow. -->
    <filter id="press" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#FFFAF0" flood-opacity="0.62"/>
    </filter>
